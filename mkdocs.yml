site_name: TAMesh
site_description: TAMesh - Türkiye Meshtastic Topluluğu Dokümantasyonu
site_url: https://3geetr.is-a.dev/tamesh-docs/
repo_url: https://github.com/3geetr/tamesh-docs
repo_name: 3geetr/tamesh-docs
edit_uri: edit/main/docs/

theme:
  logo: assets/tamesh.svg
  favicon: assets/tamesh.svg
  name: material
  language: tr
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Aydınlık moda geç
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Karanlık moda geç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Sistem tercihine geç

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      title: İçindekiler

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/3geetr
      name: GitHub
    - icon: fontawesome/brands/telegram
      link: https://t.me/meshtastic_tr
      name: Telegram

copyright: Copyright &copy; 2026 TAMesh

nav:
  - Başlangıç:
      - baslangic/index.md
      - Frekans Seçimi: baslangic/frekans-secimi.md
      - Hazır Cihazlar: baslangic/hazir-cihazlar.md
      - DIY (Kendin Yap):
          - ESP32 Kurulumu: baslangic/diy/esp32.md
          - nRF52840 Kurulumu: baslangic/diy/nrf52840.md
          - Parça Listesi: baslangic/diy/parca-listesi.md
  - Rehberler:
      - Yazılım Yükleme/Güncelleme: rehberler/yazilim.md
      - İlk Kurulum: rehberler/ilk-kurulum.md